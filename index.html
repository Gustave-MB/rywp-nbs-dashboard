<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kigali Nature Based Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <header class="brand">
          <img src="./logo.png" alt="RYWP Logo" class="brand-logo" style="max-width: 120px; width: 100%; height: auto; display: block; margin: 0 auto;" />
          <!-- <div class="brand-mark">R</div> -->
          <!-- <div><h1>RYWP</h1><span>Spatial explorer</span></div> -->
        </header>

        <section class="sidebar-section layers-section">
          <div class="section-heading"><h2>Map layers</h2></div>
          <div id="layer-list" class="layer-list"></div>
        </section>

        <section class="sidebar-section filters-section">
          <div class="section-heading"><h2>Filter data</h2><button id="clear-filters" class="text-button">Clear</button></div>
          <label class="field-label" for="intervention-filter">Intervention</label>
          <select id="intervention-filter"><option value="all">All interventions</option></select>
          <label class="field-label" for="district-filter">District</label>
          <select id="district-filter"><option value="all">All districts</option></select>
          <label class="field-label" for="sector-filter">Sector</label>
          <select id="sector-filter"><option value="all">All sectors</option></select>
        </section>
      </aside>

      <section class="map-workspace">
        <header class="toolbar">
          <div class="page-title"><h2>Nature Based Solutions</h2></div>
          <div class="toolbar-actions">
            <label class="search"><span>⌕</span><input id="search-input" type="search" placeholder="Search features…" /></label>
            <button id="fit-map" class="icon-button" title="Fit visible data">⤢</button>
          </div>
        </header>
        <div class="map-wrap">
          <div id="map"></div>
          <div id="empty-state" class="empty-state hidden"><strong>No matching features</strong><span>Adjust the search or filters to see data.</span></div>

          <section id="dashboard" class="dashboard-panel" aria-label="Dashboard overview">
            <header class="dashboard-header">
              <h3 class="dashboard-title">Overview</h3>
              <p id="dashboard-scope" class="dashboard-scope">All areas</p>
              <button id="toggle-dashboard" class="dashboard-toggle" type="button" aria-expanded="true" aria-controls="dashboard-body" title="Minimize dashboard"><span aria-hidden="true"></span></button>
            </header>
            <div id="dashboard-body" class="dashboard-body">
              <div class="dashboard-grid">
                <div class="dashboard-card" data-metric="forest">
                  <div class="dashboard-icon">🌳</div>
                  <div class="dashboard-value">—</div>
                  <div class="dashboard-label">Forest</div>
                </div>
                <div class="dashboard-card" data-metric="agroforest">
                  <div class="dashboard-icon">🌾</div>
                  <div class="dashboard-value">—</div>
                  <div class="dashboard-label">Agroforestry</div>
                </div>
                <div class="dashboard-card" data-metric="buffer">
                  <div class="dashboard-icon">🛡️</div>
                  <div class="dashboard-value">—</div>
                  <div class="dashboard-label">Buffer zones</div>
                </div>
                <div class="dashboard-card" data-metric="urban">
                  <div class="dashboard-icon">🌲</div>
                  <div class="dashboard-value">—</div>
                  <div class="dashboard-label">Urban trees</div>
                </div>
                <div class="dashboard-card" data-metric="open-space">
                  <div class="dashboard-icon">🛝</div>
                  <div class="dashboard-value">—</div>
                  <div class="dashboard-label">Open spaces</div>
                </div>
              </div>
              <p class="dashboard-hint">Click a feature on the map to see its details.</p>
            </div>
          </section>
        </div>
      </section>

    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
